services:
  caddy:
    image: caddy:2.11.4
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data"]
    depends_on: [web, worker]
    restart: unless-stopped
    networks: [public, internal]
  web:
    build: { context: ., target: web }
    env_file: .env
    environment:
      DATABASE_URL: postgres://scrapepilot:${POSTGRES_PASSWORD}@postgres:5432/scrapepilot
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["artifacts:/data/artifacts"]
    restart: unless-stopped
    networks: [public, internal]
  worker:
    init: true
    build: { context: ., target: worker }
    env_file: .env
    environment:
      DATABASE_URL: postgres://scrapepilot:${POSTGRES_PASSWORD}@postgres:5432/scrapepilot
      REDIS_HOST: redis
      ARTIFACT_DIR: /data/artifacts
      BROWSER_PROXY: http://egress:3002
    volumes: ["artifacts:/data/artifacts"]
    shm_size: 1gb
    mem_limit: 4g
    cpus: 2
    cap_drop: [ALL]
    security_opt:
      ["no-new-privileges:true", "seccomp=./docker/seccomp_profile.json"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal]
  egress:
    build: { context: ., target: base }
    command: ["pnpm", "exec", "tsx", "apps/worker/src/egress.ts"]
    user: node
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [public, internal]
    restart: unless-stopped
  webhooks:
    build: { context: ., target: base }
    command: ["pnpm", "exec", "tsx", "apps/worker/src/webhooks.ts"]
    user: node
    env_file: .env
    environment:
      DATABASE_URL: postgres://scrapepilot:${POSTGRES_PASSWORD}@postgres:5432/scrapepilot
      REDIS_HOST: redis
    networks: [public, internal]
    restart: unless-stopped
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: scrapepilot
      POSTGRES_DB: scrapepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrapepilot"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]
  redis:
    image: redis:8.10.1
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]
networks:
  public:
  internal:
    internal: true
volumes:
  postgres:
  redis:
  artifacts:
  caddy:
