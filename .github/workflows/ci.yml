name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: scrapepilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: scrapepilot
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U scrapepilot" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.1
        ports: ["56379:6379"]
    env:
      DATABASE_URL: postgres://scrapepilot:ci-only-password@localhost:5432/scrapepilot
      TEST_DATABASE_URL: postgres://scrapepilot:ci-only-password@localhost:5432/scrapepilot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install -g pnpm@12.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm --filter @scrapepilot/scraper-engine exec playwright install --with-deps chromium
      # Ubuntu 24.04 runners block the user namespaces Chromium's sandbox needs. The engine keeps the
      # sandbox on (chromiumSandbox: true), so allow namespaces on the runner instead of disabling it.
      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm test
      - run: pnpm build
